name: Daily Scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scrape and sync DB on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 40m
          script: |
            set -e
            cd /var/www/auto-analytics/app
            # DATABASE_URL живёт только на сервере (root, chmod 600) — секрет в GitHub не нужен
            set -a
            . /etc/auto-analytics.env
            set +a
            git fetch origin
            git reset --hard origin/master
            npm ci --no-audit --no-fund
            AUTO_MIGRATE=1 node scraper/migrate.js
            node scraper/cleanup.js
            node scraper/index.js
            node scraper/rolf.js
